[project]
name = "uct_benchmark"
version = "2.0.1"
description = "UCT Benchmark - Combined Pipeline and Demo UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core pipeline
    "aiohttp>=3.13.0",
    "astropy>=7.1.1",
    "loguru>=0.7.0",
    "matplotlib>=3.8.0",
    "nest-asyncio",
    "numpy>=1.26.0",
    "orekit-jpype>=13.1.2.1",
    "pandas>=2.1.0",
    "polars>=1.35.1",
    "pyarrow>=22.0.0",
    "python-dotenv",
    "requests>=2.32.5",
    "scikit-learn",
    "scipy",
    "tqdm",
    "typer",
    # Backend API
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    # Database (PostgreSQL only — DuckDB is a local/dgx extra)
    "psycopg2-binary>=2.9.9",
    # Migrations
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    # Auth & Security
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=41.0.0",
    "supabase>=2.0.0",
    "slowapi>=0.1.9",
    # Monitoring
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-timeout",
    "pytest-mock",
    "ruff>=0.14.0",
    "httpx",
    "duckdb>=1.0.0",
    "testcontainers[postgres]>=4.0.0",
]
# DGX Spark local edition: install with `pip install ".[local-dgx]"`.
# Pulls DuckDB so the default DATABASE_BACKEND=duckdb path works without the
# dev extras group. Cloud builds (Railway) do NOT need this group.
#
# Phase 2 LLM features (NL-to-SQL, Explain Results, Chat, Validator Assistant)
# also live behind the LOCAL_DGX_MODE env flag and need:
#   - httpx: thin async HTTP client used by backend_api/services/llm/client.py
#     to talk to the in-cluster Ollama service. (Already in [dev]; promoted
#     here so the local-dgx install pulls it without the rest of dev.)
#   - sqlglot: pure-Python SQL AST parser used by services/llm/sql_safety.py
#     to validate that LLM-generated queries are read-only SELECTs against
#     allowlisted tables before they ever reach DuckDB.
local-dgx = [
    "duckdb>=1.0.0",
    "httpx>=0.27",
    "sqlglot>=25.0",
]
# Legacy desktop GUI dependencies. Not installed by default; the cloud builds
# never need Tk and the DGX local edition runs headless via the web frontend.
# Kept here so anyone reviving the old CustomTkinter scripts in
# reference-code/jovan-linuxTesting/ can `pip install ".[desktop]"`.
desktop = [
    "customtkinter>=5.2.2",
]
docs = [
    "mkdocs",
    "mkdocs-material",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uct_benchmark"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
timeout = 60  # Default timeout of 60 seconds per test

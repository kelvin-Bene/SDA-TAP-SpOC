name: Deploy Production to Railway

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: ./UCT-Benchmark-DMR/combined
        run: pip install ".[dev]"

      - name: Run backend API tests (strict)
        working-directory: ./UCT-Benchmark-DMR/combined
        run: |
          pip install pytest-cov
          pytest backend_api/tests/test_auth.py \
            backend_api/tests/test_feedback.py \
            backend_api/tests/test_jobs.py \
            backend_api/tests/test_leaderboard.py \
            backend_api/tests/test_crypto.py \
            backend_api/tests/test_middleware.py \
            backend_api/tests/test_workers.py \
            -v --cov=backend_api --cov-report=term-missing --timeout=60

      - name: Run pipeline tests (legacy, non-blocking)
        working-directory: ./UCT-Benchmark-DMR/combined
        run: |
          pytest tests/ -v --timeout=60 \
            -k "not orekit and not simulation_full" \
            --ignore=tests/e2e || echo "::warning::Some legacy pipeline tests failed (pre-existing)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UCT-Benchmark-DMR/combined/frontend/package-lock.json

      - name: TypeScript type check
        working-directory: ./UCT-Benchmark-DMR/combined/frontend
        run: |
          npm ci
          npx tsc --noEmit

      - name: Run frontend unit tests
        working-directory: ./UCT-Benchmark-DMR/combined/frontend
        run: npx vitest run --reporter=verbose --coverage

  deploy-backend:
    name: Deploy Backend (production)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli@4.36.0
      - name: Deploy
        working-directory: ./UCT-Benchmark-DMR/combined
        run: railway up --service backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
      - name: Verify backend deployment
        env:
          BACKEND_URL: ${{ secrets.PROD_BACKEND_URL }}
        if: env.BACKEND_URL != ''
        run: |
          echo "Waiting 60s for Railway async deploy..."
          sleep 60
          for i in $(seq 1 12); do
            if curl -sf "${BACKEND_URL}/health" > /dev/null 2>&1; then
              echo "Backend health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/12 failed, waiting 15s..."
            sleep 15
          done
          echo "::warning::Backend health check didn't pass in time (Railway async deploy may still be building)"

  deploy-frontend:
    name: Deploy Frontend (production)
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UCT-Benchmark-DMR/combined/frontend/package-lock.json
      - name: Build Frontend
        working-directory: ./UCT-Benchmark-DMR/combined/frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.PROD_BACKEND_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Prepare deploy directory
        run: |
          rm -rf deploy-dist
          mkdir -p deploy-dist
          cp -r UCT-Benchmark-DMR/combined/frontend/dist deploy-dist/
          cp UCT-Benchmark-DMR/combined/frontend/nginx.conf.template deploy-dist/
          cp UCT-Benchmark-DMR/combined/frontend/Dockerfile.railway deploy-dist/Dockerfile
          cp UCT-Benchmark-DMR/combined/frontend/railway.toml deploy-dist/
      - name: Install Railway CLI
        run: npm i -g @railway/cli@4.36.0
      - name: Deploy
        working-directory: ./deploy-dist
        run: railway up --service frontend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
      - name: Verify frontend deployment
        env:
          FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
        if: env.FRONTEND_URL != ''
        run: |
          echo "Waiting 60s for Railway async deploy..."
          sleep 60
          for i in $(seq 1 12); do
            if curl -sf "${FRONTEND_URL}" > /dev/null 2>&1; then
              echo "Frontend health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/12 failed, waiting 15s..."
            sleep 15
          done
          echo "::warning::Frontend health check didn't pass in time (Railway async deploy may still be building)"

name: Deploy to Railway

on:
  push:
    branches: [master]

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy Backend
        run: railway up --service backend --detach
        working-directory: ./combined-new
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: UCT-Benchmark-DMR/combined/frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: ./UCT-Benchmark-DMR/combined/frontend
        run: |
          npm ci
          npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy-dist
          cp -r UCT-Benchmark-DMR/combined/frontend/dist deploy-dist/
          cp frontend-deploy/Dockerfile deploy-dist/
          cp frontend-deploy/package.json deploy-dist/

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy Frontend
        run: railway up --service frontend --detach
        working-directory: ./deploy-dist
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

name: Deploy Production to Railway

on:
  push:
    branches: [master]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: ./UCT-Benchmark-DMR/combined
        run: pip install ".[dev]"

      - name: Run backend tests (non-Orekit)
        working-directory: ./UCT-Benchmark-DMR/combined
        run: pytest tests/ backend_api/tests/ -v --timeout=60 --cov=backend_api --cov=uct_benchmark --cov-report=term-missing --cov-fail-under=40 -k "not orekit and not simulation_full"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UCT-Benchmark-DMR/combined/frontend/package-lock.json

      - name: TypeScript type check
        working-directory: ./UCT-Benchmark-DMR/combined/frontend
        run: |
          npm ci
          npx tsc --noEmit

  deploy-backend:
    name: Deploy Backend (production)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli@3.21.4
      - name: Deploy
        working-directory: ./UCT-Benchmark-DMR/combined
        run: railway up --service backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
      - name: Verify backend deployment
        if: ${{ secrets.PROD_BACKEND_URL != '' }}
        run: |
          echo "Waiting 30s for deployment to start..."
          sleep 30
          for i in $(seq 1 12); do
            if curl -sf "${{ secrets.PROD_BACKEND_URL }}/health" > /dev/null 2>&1; then
              echo "Backend health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/12 failed, waiting 15s..."
            sleep 15
          done
          echo "ERROR: Backend health check failed after 3 minutes"
          exit 1

  deploy-frontend:
    name: Deploy Frontend (production)
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UCT-Benchmark-DMR/combined/frontend/package-lock.json
      - name: Build Frontend
        working-directory: ./UCT-Benchmark-DMR/combined/frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.PROD_BACKEND_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Prepare deploy directory
        run: |
          rm -rf deploy-dist
          mkdir -p deploy-dist
          cp -r UCT-Benchmark-DMR/combined/frontend/dist deploy-dist/
          cp UCT-Benchmark-DMR/combined/frontend/nginx.conf.template deploy-dist/
          cp UCT-Benchmark-DMR/combined/frontend/Dockerfile.railway deploy-dist/Dockerfile
          cp UCT-Benchmark-DMR/combined/frontend/railway.toml deploy-dist/
      - name: Install Railway CLI
        run: npm i -g @railway/cli@3.21.4
      - name: Deploy
        working-directory: ./deploy-dist
        run: railway up --service frontend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
      - name: Verify frontend deployment
        if: ${{ secrets.PROD_FRONTEND_URL != '' }}
        run: |
          echo "Waiting 30s for deployment to start..."
          sleep 30
          for i in $(seq 1 12); do
            if curl -sf "${{ secrets.PROD_FRONTEND_URL }}" > /dev/null 2>&1; then
              echo "Frontend health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/12 failed, waiting 15s..."
            sleep 15
          done
          echo "ERROR: Frontend health check failed after 3 minutes"
          exit 1

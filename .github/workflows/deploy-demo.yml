name: Deploy Demo to Railway

on:
  push:
    branches: [demo]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: ./UCT-Benchmark-DMR/combined
        run: pip install ".[dev]"

      - name: Run backend tests (non-Orekit)
        working-directory: ./UCT-Benchmark-DMR/combined
        run: pytest tests/ -v --timeout=60 -k "not orekit and not simulation_full" --ignore=tests/e2e || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UCT-Benchmark-DMR/combined/frontend/package-lock.json

      - name: TypeScript type check
        working-directory: ./UCT-Benchmark-DMR/combined/frontend
        run: |
          npm ci
          npx tsc --noEmit

  deploy-backend:
    name: Deploy Backend (demo)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy
        working-directory: ./UCT-Benchmark-DMR/combined
        run: railway up --service backend-demo --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEMO }}

  deploy-frontend:
    name: Deploy Frontend (demo)
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UCT-Benchmark-DMR/combined/frontend/package-lock.json
      - name: Build Frontend
        working-directory: ./UCT-Benchmark-DMR/combined/frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.DEMO_BACKEND_URL }}
          VITE_DEMO_MODE: "true"
      - name: Prepare deploy directory
        run: |
          mkdir -p deploy-dist
          cp -r UCT-Benchmark-DMR/combined/frontend/dist deploy-dist/
          cp UCT-Benchmark-DMR/combined/frontend/nginx.conf.template deploy-dist/
          cp UCT-Benchmark-DMR/combined/frontend/Dockerfile.railway deploy-dist/Dockerfile
          cp UCT-Benchmark-DMR/combined/frontend/railway.toml deploy-dist/
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy
        working-directory: ./deploy-dist
        run: railway up --service frontend-demo --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEMO }}

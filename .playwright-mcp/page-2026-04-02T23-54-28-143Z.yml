                  - heading "Welcome to SpOC" [level=3] [ref=e152]
                  - paragraph [ref=e153]: The SpOC (Space Operations Center) UCT Benchmark Platform is a standardized framework for evaluating Uncorrelated Track (UCT) processing algorithms. This guide will help you get started with generating datasets, submitting your algorithm results, and understanding your performance metrics.
                  - heading "Quick Start Steps" [level=3] [ref=e154]
                  - list [ref=e155]:
                    - listitem [ref=e156]:
                      - strong [ref=e157]: Generate a Dataset
                      - text: "- Navigate to Datasets > Generate and configure your benchmark dataset parameters. Start with the \"Easy\" preset for your first run."
                    - listitem [ref=e158]:
                      - strong [ref=e159]: Download the Dataset
                      - text: "- Once generated, download the dataset JSON file containing observations and the truth catalog."
                    - listitem [ref=e160]:
                      - strong [ref=e161]: Run Your Algorithm
                      - text: "- Process the observations with your UCT algorithm to produce track associations and state estimates."
                    - listitem [ref=e162]:
                      - strong [ref=e163]: Submit Results
                      - text: "- Upload your algorithm output through the Submit page. The system will validate your submission and run the evaluation pipeline."
                    - listitem [ref=e164]:
                      - strong [ref=e165]: View Results
                      - text: "- Once evaluation is complete, view your detailed results and compare against the leaderboard."

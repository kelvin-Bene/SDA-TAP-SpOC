                  - heading "Welcome to SpOC" [level=3] [ref=e88]
                  - paragraph [ref=e89]: The SpOC (Space Operations Center) UCT Benchmark Platform is a standardized framework for evaluating Uncorrelated Track (UCT) processing algorithms. This guide will help you get started with generating datasets, submitting your algorithm results, and understanding your performance metrics.
                  - heading "Quick Start Steps" [level=3] [ref=e90]
                  - list [ref=e91]:
                    - listitem [ref=e92]:
                      - strong [ref=e93]: Generate a Dataset
                      - text: "- Navigate to Datasets > Generate and configure your benchmark dataset parameters. Start with the \"Easy\" preset for your first run."
                    - listitem [ref=e94]:
                      - strong [ref=e95]: Download the Dataset
                      - text: "- Once generated, download the dataset JSON file containing observations and the truth catalog."
                    - listitem [ref=e96]:
                      - strong [ref=e97]: Run Your Algorithm
                      - text: "- Process the observations with your UCT algorithm to produce track associations and state estimates."
                    - listitem [ref=e98]:
                      - strong [ref=e99]: Submit Results
                      - text: "- Upload your algorithm output through the Submit page. The system will validate your submission and run the evaluation pipeline."

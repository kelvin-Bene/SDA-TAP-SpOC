                  - paragraph [ref=e252]: "Track associations are evaluated as a binary classification problem:"
                  - list [ref=e253]:
                    - listitem [ref=e254]:
                      - strong [ref=e255]: True Positive (TP)
                      - text: ": Correctly associated track to catalog object"
                    - listitem [ref=e256]:
                      - strong [ref=e257]: False Positive (FP)
                      - text: ": Incorrectly associated track (wrong object or non-existent)"
                    - listitem [ref=e258]:
                      - strong [ref=e259]: False Negative (FN)
                      - text: ": Missed association (catalog object not tracked)"
                  - heading "Primary Metrics" [level=4] [ref=e260]
                  - list [ref=e261]:
                    - listitem [ref=e262]:
                      - strong [ref=e263]: Precision
                      - text: = TP / (TP + FP) - How many of your associations are correct?
                    - listitem [ref=e264]:
                      - strong [ref=e265]: Recall
                      - text: = TP / (TP + FN) - How many catalog objects did you find?
                    - listitem [ref=e266]:
                      - strong [ref=e267]: F1-Score
                      - text: = 2 × (Precision × Recall) / (Precision + Recall) - Harmonic mean
                  - heading "State Estimation Metrics" [level=3] [ref=e268]
                  - paragraph [ref=e269]: "For correctly associated objects, we evaluate state estimation accuracy:"
                  - list [ref=e270]:
